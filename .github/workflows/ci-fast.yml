name: Fast CI - Code Style and Standard Regression Tests

# CI split: ci-fast provides a quick signal on feature-branch pushes;
# ci-full covers pull requests and the protected branches (main, develop).
# main/develop are ignored here because ci-full already runs the same
# codestyle and ubuntu/py3.13 test jobs on pushes to those branches.
on:
  push:
    branches-ignore:
      - main
      - develop
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

env:
  PIP_CACHE_DIR: ~/.cache/pip
  # Must match ci-full.yml, which is what populates this cache. develop is the
  # default branch, so caches it writes are readable from every branch here.
  ASTROPY_CACHE_VERSION: v1

jobs:
  codestyle:
    name: Code Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run flake8 checks
        run: tox -e codestyle

  test:
    name: Regression Tests
    runs-on: ubuntu-latest
    needs: codestyle
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      # Read-only: ci-full is the only writer. A miss here just means the JPL
      # ephemeris is downloaded as before.
      - name: Restore astropy data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.astropy/cache
            ~/.cache/astropy
          key: astropy-${{ runner.os }}-de430-${{ env.ASTROPY_CACHE_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Run tests
        run: tox -e py313-test
